name: Mirror upstream release

# 目的：本仓库是上游 DSH-APP/DSHA 的镜像。这个工作流每 6 小时检查一次上游有没有新
# Release，有就把官方 APK 原样搬过来——不重新打包、不重新签名，sha256 与上游逐字节一致。
# 也可手动触发，指定 tag 补同步某个特定版本。
on:
  schedule:
    - cron: '17 */6 * * *'   # 每 6 小时；错开整点，避免和其它 job 抢资源
  workflow_dispatch:
    inputs:
      tag:
        description: '只同步指定 tag（留空=自动取上游最新正式版）'
        required: false
        type: string
      limit:
        description: '自动模式下最多同步几个最新 Release（默认 1）'
        required: false
        default: '1'
        type: string
      include_low:
        description: '同时镜像 low 变体（+350MB，仅老设备需要）'
        required: false
        default: false
        type: boolean
      include_source:
        description: '同时镜像 source.zip（+700MB，不推荐）'
        required: false
        default: false
        type: boolean
      replace:
        description: '允许覆盖已存在但摘要不同的资产（谨慎）'
        required: false
        default: false
        type: boolean
      dry_run:
        description: '只检查、不上传'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: mirror-upstream-release
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write   # 需要创建 Release 并上传资产
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: scripts
          sparse-checkout-cone-mode: false

      - name: Sync upstream release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORK: ${{ github.repository }}
          UPSTREAM: DSH-APP/DSHA
          UPSTREAM_TAG: ${{ inputs.tag }}
          LIMIT: ${{ inputs.limit || '1' }}
          INCLUDE_LOW: ${{ inputs.include_low }}
          INCLUDE_SOURCE: ${{ inputs.include_source }}
          REPLACE: ${{ inputs.replace }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          args=()
          if [ "${DRY_RUN}" = "true" ]; then args+=(--dry-run); fi
          python3 scripts/mirror-upstream-release.py "${args[@]}"

